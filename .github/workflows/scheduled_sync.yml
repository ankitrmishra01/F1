name: Scheduled F1 Data Sync & Model Retrain

on:
  schedule:
    # Runs every Sunday at 20:00 UTC (after Grand Prix finishes) and Wednesdays at 12:00 UTC
    - cron: '0 20 * * 0'
    - cron: '0 12 * * 3'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync_and_retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync Race Schedule & Historical Telemetry
        run: |
          cd backend
          python sync_all_historical.py

      - name: Retrain Production ML Model
        run: |
          cd backend
          python train_model.py

      - name: Commit and Push Updated Database & Models
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add backend/data/f1.db backend/f1.db backend/app/ml/models/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): Auto-sync F1 telemetry and retrain production ML model" && git push)
